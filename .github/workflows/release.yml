name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        working-directory: crates/client-app
        run: npm install

      - name: Build Tauri Client App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/client-app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Inactive ${{ github.ref_name }}'
          releaseBody: 'Inactive Remote Desktop Release ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false

      - name: Build Host Agent Binary
        continue-on-error: true
        run: cargo build --release --package host-agent

      - name: Upload Host Agent (macOS)
        if: matrix.platform == 'macos-latest'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} target/release/inactive-agent#inactive-agent-macos-arm64 --clobber || true

      - name: Upload Host Agent (Windows)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} target/release/inactive-agent.exe#inactive-agent-windows-x64.exe --clobber || true
