[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/host-agent",
    "crates/signaling-server",
    "crates/client-app/src-tauri",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
authors = ["Remote Desktop Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# QUIC networking
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }

# Web framework (signaling server)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Cryptography (E2EE)
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Config
config = "0.14"

