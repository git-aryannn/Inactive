# Remote Desktop — Cloud Server Deployment
# Deploy on any VPS (Hetzner ~₹500/month, DigitalOcean ~$5/month, etc.)
#
# Usage:
#   docker compose up -d
#
# Ports:
#   443 → Signaling Server (WSS/TLS WebSocket)
#   3478/UDP → STUN server (NAT traversal)
#   5349/UDP → STUN over TLS
#   49152-65535/UDP → TURN relay (dynamic media ports)

version: '3.8'

services:
  # ─── Signaling Server ─────────────────────────────────────────────────────
  signaling:
    image: remote-desk-signaling:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.signaling
    restart: unless-stopped
    ports:
      - "8080:8080"     # HTTP (dev mode)
      - "443:443"       # HTTPS/WSS (production, needs TLS cert)
    environment:
      - RUST_LOG=signaling_server=info
      - LISTEN_ADDR=0.0.0.0:8080
    volumes:
      - ./certs:/certs:ro    # TLS certificates (Let's Encrypt)
    networks:
      - remote-desk-net

  # ─── TURN/STUN Server (coturn) ────────────────────────────────────────────
  # Used when P2P connection fails (strict firewall / symmetric NAT)
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host    # Must use host networking for TURN to work
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
      - --fingerprint
      - --no-auth            # Open relay (add auth in production)
      - --realm=remotedesk.yourdomain.com
      - --listening-port=3478
      - --tls-listening-port=5349
    # For production with TLS:
    # volumes:
    #   - ./certs/fullchain.pem:/etc/coturn/cert.pem:ro
    #   - ./certs/privkey.pem:/etc/coturn/key.pem:ro

  # ─── Nginx Reverse Proxy (optional, for TLS termination) ──────────────────
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/certs:ro
  #   depends_on:
  #     - signaling

networks:
  remote-desk-net:
    driver: bridge

